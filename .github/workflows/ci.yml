name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Old PHP jobs intentionally resolve historical Twig/Symfony versions to
      # verify this library's compatibility surface. Consumer installs keep
      # Composer's default security blocking behavior.
      - run: composer update --prefer-dist --no-interaction --no-security-blocking
      - run: composer check
